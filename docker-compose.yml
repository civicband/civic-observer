x-django-settings: &django-settings
  image: civic-observer:${VERSION:-latest}
  build: .
  depends_on:
    redis:
      condition: service_healthy
  env_file: .env
  init: true
  restart: on-failure
  networks:
    civic-network:

x-django-web: &django-web
  <<: *django-settings
  entrypoint: ["/src/compose-entrypoint.sh"]
  command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
  healthcheck:
    test: ["CMD", "curl", "--fail", "http://localhost:8000/health/"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s

x-django-worker: &django-worker
  <<: *django-settings
  entrypoint: ["/src/compose-entrypoint.sh"]
  command: python manage.py rqworker default

services:
  db:
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
    image: "postgres:17-alpine"
    init: true
    ports:
      - "5433:5432"
    volumes:
      - .:/src:cache
      - postgres-data:/var/lib/postgresql/data/
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c listen_addresses=*
    shm_size: 1gb
    networks:
      - civic-network

  redis:
    image: "redis:7-alpine"
    init: true
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis-data:/data
    restart: on-failure
    networks:
      - civic-network

  utility:
    <<: *django-settings
    tty: true

  web-blue:
    <<: *django-web
    container_name: observer-web-blue
    ports:
      - "8888:8000"

  worker-blue:
    <<: *django-worker
    container_name: observer-worker-blue

  web-green:
    <<: *django-web
    container_name: observer-web-green
    ports:
      - "8889:8000"

  worker-green:
    <<: *django-worker
    container_name: observer-worker-green

  tailwind:
    <<: *django-settings
    command: python manage.py tailwind watch
    init: true
    tty: true
    depends_on:
      - db

volumes:
  postgres-data:
  redis-data:

networks:
  civic-network:
