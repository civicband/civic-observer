{% if places %}
    <ul class="divide-y divide-gray-200 rounded-md border border-gray-200 dark:divide-gray-800 dark:border-gray-800">
        {% for place in places %}
            <li>
                <button type="button"
                        @click="$dispatch('place-picked', { id: '{{ place.pk }}' }); picked = '{{ place.pk }}'"
                        data-place-result="{{ place.pk }}"
                        class="flex w-full items-center justify-between gap-2 px-3 py-2 text-left hover:bg-gray-50 dark:hover:bg-gray-800">
                    <span class="min-w-0">
                        <span class="font-medium text-gray-900 dark:text-gray-100">{{ place.name }}</span>
                        <span class="ml-1 text-xs text-gray-500 dark:text-gray-400">
                            {{ place.get_place_type_display }}{% if place.state %} · {{ place.state }}{% endif %}{% if place.muni %} · {{ place.muni.name }}{% endif %}
                        </span>
                    </span>
                    {% if place.muni %}
                        <span class="shrink-0 rounded bg-emerald-100 px-1.5 py-0.5 text-[11px] font-medium text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200">Covered</span>
                    {% endif %}
                </button>
            </li>
        {% endfor %}
    </ul>
{% elif query %}
    <p class="text-xs text-gray-500 dark:text-gray-400">No places match “{{ query }}”.</p>
{% endif %}
