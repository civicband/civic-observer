{% comment %}
Inline place correction: a typeahead over existing places plus a
"no place / wrong thread" action. Selecting a result posts the place id.
{% endcomment %}
<div class="mt-5 rounded-md border border-dashed border-gray-300 p-3 dark:border-gray-700">
    <h4 class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Correct place</h4>
    <form method="post"
          action="{% url 'watch:place-correct' thread.pk %}"
          hx-post="{% url 'watch:place-correct' thread.pk %}"
          hx-target="#triage-detail"
          hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="place_id" :value="pickedPlace">
        <div class="mt-2 flex flex-wrap items-center gap-2">
            <label class="sr-only" for="place-search-{{ thread.pk }}">Search places</label>
            <input id="place-search-{{ thread.pk }}"
                   type="search"
                   name="q"
                   autocomplete="off"
                   placeholder="Search places to assign"
                   hx-get="{% url 'watch:place-search' %}"
                   hx-trigger="input changed delay:300ms, search"
                   hx-target="#place-search-results-{{ thread.pk }}"
                   hx-swap="innerHTML"
                   class="flex-1 min-w-0 rounded-md border-gray-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:placeholder-gray-400">
            <label class="sr-only" for="role-{{ thread.pk }}">Role</label>
            <select id="role-{{ thread.pk }}"
                    name="role"
                    class="rounded-md border-gray-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
                <option value="subject" selected>Subject</option>
                <option value="mentioned">Mentioned</option>
            </select>
            <label class="sr-only" for="matched-{{ thread.pk }}">Alias</label>
            <input id="matched-{{ thread.pk }}"
                   type="text"
                   name="matched_text"
                   placeholder="Alias (optional)"
                   class="w-40 rounded-md border-gray-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:placeholder-gray-400">
        </div>
        <div id="place-search-results-{{ thread.pk }}"
             class="mt-2 text-sm"></div>
        <div class="mt-2 flex flex-wrap items-center gap-2">
            <button type="submit"
                    class="inline-flex items-center px-3 py-1.5 border border-gray-300 text-xs font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 dark:hover:bg-gray-800">
                Assign place
            </button>
        </div>
    </form>
    <form class="mt-2"
          method="post"
          action="{% url 'watch:action' thread.pk %}"
          hx-post="{% url 'watch:action' thread.pk %}"
          hx-target="#triage-detail"
          hx-swap="innerHTML"
          data-action="no_place">
        {% csrf_token %}
        <input type="hidden" name="action" value="no_place">
        <button type="submit"
                class="text-xs font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
            No place / wrong thread
        </button>
    </form>
</div>
