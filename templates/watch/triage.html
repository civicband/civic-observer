{% extends "base.html" %}

{% block title %}Triage - CivicObserver{% endblock %}

{% block content %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-gray-100">Triage</h1>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    {{ queue_count }} thread{{ queue_count|pluralize }} in the queue
                    <span class="mx-1">·</span>
                    <a href="{% url 'watch:backlog' %}"
                       class="text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300">Backlog</a>
                </p>
            </div>
        </div>

        <div id="triage-card" class="mt-6">
            {% include "watch/partials/triage_card.html" %}
        </div>
    </div>
{% endblock content %}
