<div id="set-counters">
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
        <span class="mr-1 text-gray-500 dark:text-gray-400"><span id="lens-count">{{ lens_count }}</span> in this view:</span>
        {% for link in disposition_links %}
            <a href="?{{ link.querystring }}"
               class="inline-flex items-center rounded-full px-2.5 py-0.5 mr-1 text-xs font-medium border {% if link.value == 'r' %}border-emerald-200 bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-800{% elif link.value == 'i' %}border-rose-200 bg-rose-50 text-rose-700 dark:bg-rose-950 dark:text-rose-300 dark:border-rose-800{% elif link.value == 'u' %}border-amber-200 bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300 dark:border-amber-800{% else %}border-gray-300 bg-white text-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700{% endif %}">{{ link.label }} (<span id="disposition-count-{{ link.value }}">{{ link.count }}</span>)</a>
        {% endfor %}
    </p>
</div>
