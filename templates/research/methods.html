{% extends "base.html" %}

{% block title %}Methods - {{ project.name }} - Research - CivicObserver{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <nav class="text-sm text-gray-500 mb-2">
            <a href="{% url 'research:project-list' %}" class="hover:text-indigo-600">Research</a>
            <span class="mx-2">/</span>
            <a href="{% url 'research:project-detail' project.id %}" class="hover:text-indigo-600">{{ project.name }}</a>
            <span class="mx-2">/</span>
            <span class="text-gray-900">Methods</span>
        </nav>

        <div class="sm:flex sm:items-center sm:justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">Methods</h1>
                <p class="mt-2 text-sm text-gray-600">How this project's sets, decisions, and codes were produced.</p>
            </div>
            <div class="mt-4 sm:mt-0">
                <button type="button"
                        onclick="copyMethodsMarkdown()"
                        class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50">
                    Copy Markdown
                </button>
            </div>
        </div>

        <textarea id="methods-markdown-source" class="hidden" readonly>{{ methods_markdown }}</textarea>
        <pre id="methods-markdown" class="mt-6 whitespace-pre-wrap break-words rounded-lg border border-gray-200 bg-gray-50 p-4 text-sm text-gray-800">{{ methods_markdown }}</pre>
    </div>

    <script>
        function copyMethodsMarkdown() {
            const source = document.getElementById("methods-markdown-source");
            if (source && navigator.clipboard) {
                navigator.clipboard.writeText(source.value);
            }
        }
    </script>
{% endblock content %}
