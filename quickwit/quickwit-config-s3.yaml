# Quickwit node configuration for S3-backed storage (Fastly Object Storage)
#
# Required environment variables:
#   QW_S3_ENDPOINT=https://${FASTLY_REGION:-us-west}.object.fastlystorage.app
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_DEFAULT_REGION=${FASTLY_REGION:-us-west}

version: 0.8

node_id: civic-observer-1
listen_address: 0.0.0.0

rest:
  listen_port: 7280
  cors_allow_origins:
    - "*"

data_dir: /quickwit/data

# Use S3 for metastore (stores index metadata)
metastore_uri: s3://quickwit-civic-observer/metastore

# Use S3 for index storage (stores actual index data/splits)
default_index_root_uri: s3://quickwit-civic-observer/indexes
